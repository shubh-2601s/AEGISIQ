spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
aegisiq.jwt.secret=test-jwt-secret-key-for-testing-purposes-only-minimum-256-bits-long
aegisiq.jwt.expiration-ms=3600000
aegisiq.ai-service.url=http://localhost:8000
aegisiq.ai-service.api-key=test-internal-key
aegisiq.scanning.max-archive-size-bytes=52428800
aegisiq.scanning.max-extracted-size-bytes=262144000
aegisiq.scanning.max-file-count=5000
aegisiq.scanning.max-single-file-size-bytes=2097152

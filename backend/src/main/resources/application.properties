# =======================================================
# AegisIQ Backend — Application Configuration
# =======================================================

spring.application.name=aegisiq-backend
server.port=${SERVER_PORT:8080}

# --- Database ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aegisiq}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aegisiq_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aegisiq_secure_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JWT ---
aegisiq.jwt.secret=${JWT_SECRET:404e635266556a586e3272357538782f413f4428472b4b6250645367566b5970}
aegisiq.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- AI Service ---
aegisiq.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
aegisiq.ai-service.api-key=${INTERNAL_SERVICE_API_KEY:aegisiq-internal-service-secret-token}
aegisiq.ai-service.timeout-seconds=30

# --- CORS ---
aegisiq.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Scanning ---
aegisiq.scanning.max-archive-size-bytes=52428800
aegisiq.scanning.max-extracted-size-bytes=262144000
aegisiq.scanning.max-file-count=5000
aegisiq.scanning.max-single-file-size-bytes=2097152

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- Logging ---
logging.level.com.aegisiq=INFO
logging.level.org.springframework.security=WARN
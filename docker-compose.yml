services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegisiq}
      POSTGRES_USER: ${POSTGRES_USER:-aegisiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegisiq_secure_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegisiq_user} -d ${POSTGRES_DB:-aegisiq}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegisiq-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: aegisiq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aegisiq}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aegisiq_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aegisiq_secure_pass}
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:-aegisiq-internal-service-secret-token}
      JWT_SECRET: ${JWT_SECRET:-404e635266556a586e3272357538782f413f4428472b4b6250645367566b5970}
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://frontend:5173"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - aegisiq-network

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-service
    container_name: aegisiq-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:-aegisiq-internal-service-secret-token}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o-mini}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - aegisiq-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: aegisiq-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - aegisiq-network

volumes:
  postgres_data:
    driver: local

networks:
  aegisiq-network:
    driver: bridge
